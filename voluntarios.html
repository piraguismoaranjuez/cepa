<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CEPA">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<title>Mis turnos · CEPA</title>
<style>
  :root { --fondo: #f4f1ea; --tinta: #14232b; --suave: #5d6b72; --linea: #ddd6c8; --azul: #2e5797; --rojo: #a33b2b; --verde: #1f7a5a; --ambar: #8a5a12; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: var(--fondo); color: var(--tinta); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: #fff; border-bottom: 1px solid var(--linea); padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; }
  header a { color: var(--azul); text-decoration: none; font-weight: 600; font-size: 15px; }
  header b { flex: 1; text-align: center; font-size: 17px; margin-right: 52px; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px 60px; }
  h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); margin: 24px 0 10px; font-weight: 650; }
  .resumen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .resumen div { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; }
  .resumen b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .resumen span { font-size: 13px; color: var(--suave); }
  .resumen .alerta b { color: var(--ambar); }
  .turno { background: #fff; border: 1px solid var(--linea); border-left: 4px solid var(--c); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .turno .fila { display: flex; gap: 12px; align-items: center; }
  .turno .f { text-align: center; min-width: 42px; font-weight: 750; line-height: 1.1; font-size: 20px; }
  .turno .f small { display: block; font-size: 11px; color: var(--suave); font-weight: 600; text-transform: uppercase; }
  .turno .t { flex: 1; }
  .turno .t span { color: var(--suave); font-size: 14px; display: block; }
  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .botones button, button.b { font: inherit; font-weight: 650; border-radius: 12px; padding: 11px 8px; border: 1px solid var(--linea); background: #fff; color: var(--tinta); cursor: pointer; }
  .botones .si { background: var(--verde); border-color: var(--verde); color: #fff; }
  .botones .no { color: var(--rojo); }
  .chip { display: inline-block; font-size: 12.5px; border-radius: 99px; padding: 1px 9px; background: #eee9df; white-space: nowrap; }
  .chip.si { background: #dcefe6; color: var(--verde); } .chip.no { background: #f8e6e2; color: var(--rojo); }
  .chip.pend { background: #f6e8cf; color: var(--ambar); } .chip.extra { background: #ece8fa; color: #4b3cb0; }
  .motivo { font-size: 14px; color: var(--suave); margin-top: 6px; }
  a.cambiar { font-size: 13.5px; color: var(--azul); margin-left: 6px; }
  button.grande { width: 100%; font: inherit; font-weight: 650; border: 0; border-radius: 14px; padding: 15px; background: var(--azul); color: #fff; margin-top: 18px; cursor: pointer; }
  button[disabled] { opacity: .5; }
  .vacio { text-align: center; color: var(--suave); padding: 18px 10px; background: #fff; border: 1px dashed var(--linea); border-radius: 14px; }
  .oculto { display: none !important; }
  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; max-width: 90%; z-index: 20; }
  .modal { position: fixed; inset: 0; background: rgba(20, 35, 43, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal .hoja { background: #fff; width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
  .modal h3 { margin: 0 0 4px; font-size: 19px; }
  .modal p { margin: 0 0 10px; color: var(--suave); font-size: 14.5px; }
  label.p { display: block; font-weight: 600; font-size: 15px; margin: 12px 0 6px; }
  input, textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--linea); border-radius: 12px; background: #fff; color: var(--tinta); }
  textarea { min-height: 80px; resize: vertical; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rapidos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rapidos button { font: inherit; font-size: 13.5px; border: 1px solid var(--linea); background: #f7f5f0; border-radius: 99px; padding: 5px 11px; cursor: pointer; }
  .acciones { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 16px; }
  .acciones button { font: inherit; font-weight: 650; border-radius: 12px; padding: 13px; border: 1px solid var(--linea); background: #fff; cursor: pointer; }
  .acciones button.ok { background: var(--azul); border-color: var(--azul); color: #fff; }
  .msg { min-height: 20px; margin-top: 8px; font-size: 14.5px; color: var(--rojo); }
  details summary { cursor: pointer; color: var(--azul); font-size: 15px; margin: 22px 0 8px; font-weight: 600; }
</style>
</head>
<body>
<header><a href="index.html">‹ CEPA</a><b>Mis turnos</b></header>
<main>
  <div class="resumen">
    <div id="cajaPend"><b id="nPend">–</b><span>Turnos por confirmar</span></div>
    <div><b id="hMes">–</b><span>Horas este mes</span></div>
  </div>

  <h2>Por confirmar</h2>
  <div id="listaPend"><div class="vacio">Cargando…</div></div>

  <h2>Próximos turnos</h2>
  <div id="listaProx"></div>

  <button class="grande" id="btnExtra">+ Añadir un turno extra</button>

  <details id="detHist"><summary>Turnos ya confirmados</summary><div id="listaHist"></div></details>
</main>

<!-- ¿Por qué no fuiste? -->
<div class="modal oculto" id="mNo"><div class="hoja">
  <h3>No pude ir</h3>
  <p id="mNoTurno"></p>
  <label class="p" for="mNoMotivo">¿Por qué no pudiste ir?</label>
  <textarea id="mNoMotivo" maxlength="500" placeholder="Cuéntalo en pocas palabras"></textarea>
  <div class="rapidos" id="mNoRapidos"><button>Enfermo</button><button>Estudios o exámenes</button><button>Trabajo</button><button>Viaje o competición</button><button>Se suspendió la actividad</button><button>Avisé al entrenador</button></div>
  <div class="msg" id="mNoMsg"></div>
  <div class="acciones"><button id="mNoCancelar">Cancelar</button><button class="ok" id="mNoOk">Guardar</button></div>
</div></div>

<!-- Turno extra -->
<div class="modal oculto" id="mExtra"><div class="hoja">
  <h3>Turno extra</h3>
  <p>Para apuntar un día que has venido (o vas a venir) fuera de tus turnos. El club recibe un aviso.</p>
  <label class="p" for="xFecha">Día</label>
  <input type="date" id="xFecha">
  <div class="dos">
    <div><label class="p" for="xIni">De</label><input type="time" id="xIni" value="11:00"></div>
    <div><label class="p" for="xFin">A</label><input type="time" id="xFin" value="13:00"></div>
  </div>
  <label class="p" for="xMotivo">Motivo</label>
  <textarea id="xMotivo" maxlength="300" placeholder="Ej.: sustituí a un compañero, apoyo en una regata…"></textarea>
  <div class="rapidos" id="xRapidos"><button>Sustituir a un compañero</button><button>Apoyo en competición</button><button>Actividad especial</button><button>Mantenimiento de material</button></div>
  <div class="msg" id="xMsg"></div>
  <div class="acciones"><button id="xCancelar">Cancelar</button><button class="ok" id="xOk">Guardar turno extra</button></div>
</div></div>

<div id="toast" class="oculto"></div>

<script>
// ====== CONFIGURACIÓN (la misma que index.html) ======
const API_URL = "https://script.google.com/macros/s/AKfycbynhxyMOkP629Ko55Y-681TfYM0XL3FBwuvoEyl7ewNvxhtzpwJAjYjCUg8nASPufun/exec";
// =====================================================

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guardado = {
  leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  poner(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
let SESION = guardado.leer('mizona_sesion');
// Sin sesión válida: se vuelve al inicio de CEPA, que activa el móvil con el código por correo
function entrarConEnlace() {
  guardado.poner('mizona_sesion', null);
  location.replace('index.html');
  return new Promise(() => {});
}
async function api(accion, datos) {
  let r;
  try { r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ accion, sesion: SESION }, datos || {})) }); }
  catch (e) { throw new Error('Sin conexión. Inténtalo de nuevo.'); }
  if (!r.ok) throw new Error('No se ha podido conectar con el club');
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESION') return entrarConEnlace();
    throw new Error(j.error);
  }
  return j;
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('oculto'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('oculto'), 3200); }

const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fecha = (f) => new Date(f + 'T12:00:00');
const fechaLarga = (f) => { const d = fecha(f); return `${['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'][d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const horas = (h) => (Math.round(h * 100) / 100).toString().replace('.', ',') + ' h';
let D = null;

function tarjeta(t) {
  const d = fecha(t.fecha);
  const chip = t.estado === 'asistio' ? '<span class="chip si">✓ Asistí</span>'
    : t.estado === 'no_asistio' ? '<span class="chip no">No asistí</span>'
    : t.estado === 'pendiente' ? '<span class="chip pend">Por confirmar</span>' : '';
  const hoy = D.hoy, haceSemana = new Date(fecha(hoy) - 7 * 864e5).toISOString().slice(0, 10);
  const puedeCambiar = (t.estado === 'asistio' || t.estado === 'no_asistio');
  const quitar = t.extra && t.fecha >= haceSemana ? `<a href="#" class="cambiar" data-quitar="${t.id}">Quitar</a>` : '';
  return `<div class="turno" style="--c:${esc(t.color)}" data-id="${t.id}">
    <div class="fila"><div class="f">${d.getDate()}<small>${DIAS[d.getDay()]}</small></div>
      <div class="t"><b>${esc(t.nombre)}</b> ${t.extra ? '<span class="chip extra">Extra</span>' : ''}
        <span>${t.inicio ? esc(t.inicio + ' – ' + t.fin) : esc(horas(t.horas))}${t.nota && !t.extra && !t.nombre.includes(t.nota) ? ' · ' + esc(t.nota) : ''}</span></div>
      <div>${chip}</div></div>
    ${t.extra && t.nota ? `<div class="motivo">${esc(t.nota)}</div>` : ''}
    ${t.estado === 'no_asistio' ? `<div class="motivo">Motivo: ${esc(t.motivo)}</div>` : ''}
    ${t.estado === 'pendiente' ? `<div class="botones"><button class="si" data-si="${t.id}">✓ Asistí</button><button class="no" data-no="${t.id}">No pude ir</button></div>` : ''}
    ${puedeCambiar || quitar ? `<div class="motivo">${puedeCambiar ? `<a href="#" class="cambiar" data-cambiar="${t.id}">Cambiar respuesta</a>` : ''}${quitar}</div>` : ''}
  </div>`;
}

function pintar(d) {
  D = d;
  const pend = d.turnos.filter((t) => t.estado === 'pendiente').sort((a, b) => (b.fecha + b.inicio).localeCompare(a.fecha + a.inicio));
  const prox = d.turnos.filter((t) => t.estado === 'futuro');
  const hechos = d.turnos.filter((t) => t.estado === 'asistio' || t.estado === 'no_asistio').sort((a, b) => (b.fecha + b.inicio).localeCompare(a.fecha + a.inicio));
  $('nPend').textContent = pend.length; $('cajaPend').classList.toggle('alerta', pend.length > 0);
  $('hMes').textContent = horas(d.horasMes);
  $('listaPend').innerHTML = pend.length ? pend.map(tarjeta).join('') : '<div class="vacio">Todo confirmado. ¡Gracias!</div>';
  $('listaProx').innerHTML = prox.length ? prox.slice(0, 12).map(tarjeta).join('') : '<div class="vacio">No tienes turnos en las próximas semanas.</div>';
  $('listaHist').innerHTML = hechos.length ? hechos.map(tarjeta).join('') : '<div class="vacio">Todavía no has confirmado ningún turno.</div>';
}

async function cargar(op, datos) {
  const r = await api('voluntario', Object.assign({ op: op || 'datos' }, datos || {}));
  pintar(r);
  return r;
}

// ---- Confirmar
const turno = (id) => D.turnos.find((t) => String(t.id) === String(id));
let NO_ID = null;
function abrirNo(id) {
  NO_ID = id; const t = turno(id);
  $('mNoTurno').textContent = `${t.nombre} · ${fechaLarga(t.fecha)}${t.inicio ? ', de ' + t.inicio + ' a ' + t.fin : ''}`;
  $('mNoMotivo').value = t.motivo || ''; $('mNoMsg').textContent = '';
  $('mNo').classList.remove('oculto'); setTimeout(() => $('mNoMotivo').focus(), 50);
}
async function confirmar(id, asistio, motivo, boton) {
  if (boton) boton.disabled = true;
  try { await cargar('confirmar', { id: Number(id), asistio, motivo }); toast(asistio ? 'Apuntado: asististe' : 'Apuntado: no pudiste ir'); return true; }
  catch (e) { toast(e.message); return false; }
  finally { if (boton) boton.disabled = false; }
}
document.querySelector('main').addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-si],[data-no],[data-cambiar],[data-quitar]'); if (!b) return;
  ev.preventDefault();
  if (b.dataset.si) return confirmar(b.dataset.si, true, '', b);
  if (b.dataset.no) return abrirNo(b.dataset.no);
  if (b.dataset.cambiar) {
    const t = turno(b.dataset.cambiar);
    if (t.estado === 'asistio') return abrirNo(t.id);
    if (confirm('¿Cambiar a «Asistí»?')) return confirmar(t.id, true, '', null);
  }
  if (b.dataset.quitar && confirm('¿Quitar este turno extra?')) {
    try { await cargar('quitarExtra', { id: Number(b.dataset.quitar) }); toast('Turno extra quitado'); } catch (e) { toast(e.message); }
  }
});
$('mNoRapidos').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) { $('mNoMotivo').value = b.textContent; $('mNoMotivo').focus(); } });
$('mNoCancelar').onclick = () => $('mNo').classList.add('oculto');
$('mNoOk').onclick = async () => {
  const m = $('mNoMotivo').value.trim();
  if (m.length < 3) { $('mNoMsg').textContent = 'Cuéntanos por qué no pudiste ir.'; return; }
  if (await confirmar(NO_ID, false, m, $('mNoOk'))) $('mNo').classList.add('oculto');
};

// ---- Turno extra
$('btnExtra').onclick = () => {
  $('xFecha').value = D ? D.hoy : new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Madrid' });
  $('xMotivo').value = ''; $('xMsg').textContent = '';
  $('mExtra').classList.remove('oculto');
};
$('xRapidos').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) { $('xMotivo').value = b.textContent; $('xMotivo').focus(); } });
$('xCancelar').onclick = () => $('mExtra').classList.add('oculto');
$('xOk').onclick = async () => {
  const datos = { fecha: $('xFecha').value, inicio: $('xIni').value, fin: $('xFin').value, motivo: $('xMotivo').value.trim() };
  if (!datos.fecha || !datos.inicio || !datos.fin) { $('xMsg').textContent = 'Pon el día y las horas.'; return; }
  if (datos.fin <= datos.inicio) { $('xMsg').textContent = 'La hora de fin tiene que ser después de la de inicio.'; return; }
  if (datos.motivo.length < 3) { $('xMsg').textContent = 'Pon el motivo del turno extra.'; return; }
  $('xOk').disabled = true; $('xMsg').textContent = '';
  try { await cargar('extra', datos); $('mExtra').classList.add('oculto'); toast('Turno extra guardado'); }
  catch (e) { $('xMsg').textContent = e.message; }
  finally { $('xOk').disabled = false; }
};

// ---- Arranque
(async function () {
  if (!SESION) return entrarConEnlace();
  try { await cargar(); } catch (e) { $('listaPend').innerHTML = `<div class="vacio">${esc(e.message)}</div>`; }
})();
window.addEventListener('pageshow', (e) => { if (e.persisted && SESION) cargar().catch(() => {}); });
</script>
</body>
</html>
