<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CEPA">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<title>Reparaciones · CEPA</title>
<style>
  :root { --fondo: #f4f1ea; --tinta: #14232b; --suave: #5d6b72; --linea: #ddd6c8; --azul: #2e5797; --rojo: #a33b2b; --verde: #1f7a5a; --ambar: #b7791f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: var(--fondo); color: var(--tinta); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: #fff; border-bottom: 1px solid var(--linea); padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; }
  header a { color: var(--azul); text-decoration: none; font-weight: 600; font-size: 15px; }
  header b { flex: 1; text-align: center; font-size: 17px; margin-right: 52px; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px 50px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #e7e1d5; border-radius: 12px; padding: 3px; margin-bottom: 16px; }
  .seg button { border: 0; background: none; font: inherit; font-weight: 600; padding: 9px; border-radius: 10px; color: var(--suave); }
  .seg button.on { background: #fff; color: var(--tinta); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .caja { background: #fff; border: 1px solid var(--linea); border-radius: 16px; padding: 16px; }
  .intro { font-size: 14.5px; color: var(--suave); margin: 0 0 6px; }
  label.p { display: block; font-weight: 600; font-size: 15px; margin: 16px 0 6px; }
  label.p small { display: block; font-weight: 400; color: var(--suave); font-size: 13px; margin-top: 2px; }
  label.p .ob { color: var(--rojo); }
  input, textarea, select { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--linea); border-radius: 12px; background: #fff; color: var(--tinta); }
  textarea { min-height: 96px; resize: vertical; }
  .opciones { display: grid; gap: 8px; }
  .opciones label { display: flex; align-items: center; gap: 10px; border: 1px solid var(--linea); border-radius: 12px; padding: 11px 12px; font-size: 15px; }
  .opciones label:has(input:checked) { border-color: var(--azul); background: #eef2fa; }
  .opciones input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--azul); }
  button.enviar { margin-top: 20px; width: 100%; font: inherit; font-weight: 650; border: 0; border-radius: 14px; padding: 15px; background: var(--azul); color: #fff; }
  button.enviar[disabled] { opacity: .5; }
  .msg { min-height: 22px; margin-top: 10px; font-size: 15px; } .msg.error { color: var(--rojo); } .msg.ok { color: var(--verde); }
  .aviso { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .aviso b { display: block; } .aviso span { color: var(--suave); font-size: 14px; display: block; margin-top: 2px; }
  .chip { display: inline-block; font-size: 12.5px; border-radius: 99px; padding: 1px 9px; background: #eee9df; margin-top: 6px; }
  .chip.hecho { background: #dcefe6; color: var(--verde); } .chip.curso { background: #e3ecfa; color: var(--azul); }
  .chip.pend { background: #f6e8cf; color: #8a5a12; } .chip.desc { background: #eee; color: #888; }
  .vacio { text-align: center; color: var(--suave); padding: 30px 10px; }
  .oculto { display: none !important; }
  .seg.tres { grid-template-columns: 1fr 1fr 1fr; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); margin: 18px 2px 8px; }
  .buscar { display: flex; gap: 6px; margin-bottom: 10px; }
  .buscar button { border: 0; background: var(--azul); color: #fff; font: inherit; font-weight: 650; border-radius: 12px; padding: 0 16px; }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filtros button { border: 1px solid var(--linea); background: #fff; font: inherit; font-size: 14px; border-radius: 99px; padding: 5px 12px; color: var(--suave); }
  .filtros button.on { background: var(--azul); border-color: var(--azul); color: #fff; }
  .aviso .cab { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .aviso .cab small { color: var(--suave); font-size: 13px; white-space: nowrap; }
  .aviso span.chip { display: inline-block; margin-right: 4px; }
</style>
</head>
<body>
<header><a href="index.html">‹ CEPA</a><b>Reparaciones</b></header>
<main>
  <div class="seg" id="seg"><button class="on" data-v="nuevo">Avisar</button><button data-v="mios">Consultar</button><button data-v="taller" class="oculto">Taller</button></div>

  <section id="vNuevo">
    <div class="caja">
      <p class="intro">Rafa, de mantenimiento, recibe el aviso al momento y te escribirá con el día en que tienes que llevarle la piragua. <b>No la lleves antes.</b></p>
      <form id="formRep"><div id="preguntas"><p class="vacio">Cargando el formulario…</p></div>
        <button class="enviar" id="btnEnviar" disabled>Enviar aviso</button>
        <div class="msg" id="msg"></div></form>
    </div>
  </section>

  <section id="vMios" class="oculto">
    <h2>Tus avisos</h2>
    <div id="listaAvisos"></div>
    <h2>Todas las piraguas</h2>
    <form class="buscar" id="formBuscar"><input name="buscar" type="search" placeholder="Piragua o persona…"><button>Buscar</button></form>
    <div class="filtros" id="filtros"><button class="on" data-f="">Todas</button><button data-f="curso">Sin terminar</button><button data-f="hecho">Reparadas</button><button data-f="desc">Descartadas</button></div>
    <div id="listaTodas"><p class="vacio">Cargando…</p></div>
  </section>
  <datalist id="barcos"></datalist>
</main>

<script>
// ====== CONFIGURACIÓN (la misma que index.html) ======
const API_URL = "https://script.google.com/macros/s/AKfycbynhxyMOkP629Ko55Y-681TfYM0XL3FBwuvoEyl7ewNvxhtzpwJAjYjCUg8nASPufun/exec";
// =====================================================

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guardado = {
  leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  poner(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
const TOKEN = guardado.leer('fichar_token');
let SESION = guardado.leer('mizona_sesion');

async function entrarConEnlace() {
  if (!TOKEN) throw new Error('Abre CEPA desde tu enlace personal.');
  const r = await api('entrar', { token: TOKEN });
  SESION = r.sesion; guardado.poner('mizona_sesion', SESION);
}
async function api(accion, datos) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ accion, sesion: SESION }, datos || {})) });
  if (!r.ok) throw new Error('No se ha podido conectar con el club');
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESION' && accion !== 'entrar') { SESION = null; guardado.poner('mizona_sesion', null); await entrarConEnlace(); return api(accion, datos); }
    throw new Error(j.error);
  }
  return j;
}

let PREGUNTAS = [], YO = {};
function pintarFormulario(d) {
  PREGUNTAS = d.preguntas; YO = d;
  $('barcos').innerHTML = (d.barcos || []).map((b) => `<option value="${esc(b)}">`).join('');
  $('preguntas').innerHTML = d.preguntas.map((p) => {
    const esNombre = p.tipo === 'texto' && /nombre/i.test(p.titulo);
    const esPiragua = /piragua|embarcaci|barco/i.test(p.titulo);
    const cab = `<label class="p">${esc(p.titulo)}${p.obligatoria ? ' <span class="ob">*</span>' : ''}${p.ayuda ? `<small>${esc(p.ayuda)}</small>` : ''}</label>`;
    let campo;
    if (p.tipo === 'parrafo') campo = `<textarea data-id="${p.id}" ${p.obligatoria ? 'required' : ''}></textarea>`;
    else if (p.tipo === 'fecha') campo = `<input type="date" data-id="${p.id}" ${p.obligatoria ? 'required' : ''}>`;
    else if (p.tipo === 'opcion' || p.tipo === 'varias') {
      const tipo = p.tipo === 'opcion' ? 'radio' : 'checkbox';
      campo = `<div class="opciones" data-id="${p.id}" data-tipo="${p.tipo}">${p.opciones.map((o) =>
        `<label><input type="${tipo}" name="p${p.id}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`;
    } else campo = `<input data-id="${p.id}" ${esPiragua ? 'list="barcos" placeholder="Escribe modelo o número…"' : ''} value="${esNombre ? esc(d.nombre) : ''}" ${p.obligatoria ? 'required' : ''}>`;
    return cab + campo;
  }).join('');
  $('btnEnviar').disabled = false;
  pintarAvisos(d.avisos);
}
function leerRespuestas() {
  const r = {};
  for (const p of PREGUNTAS) {
    if (p.tipo === 'opcion') { const c = document.querySelector(`input[name="p${p.id}"]:checked`); r[p.id] = c ? c.value : ''; }
    else if (p.tipo === 'varias') r[p.id] = [...document.querySelectorAll(`input[name="p${p.id}"]:checked`)].map((x) => x.value);
    else r[p.id] = (document.querySelector(`[data-id="${p.id}"]`) || {}).value || '';
    const vacio = !r[p.id] || (Array.isArray(r[p.id]) && !r[p.id].length);
    if (p.obligatoria && vacio) throw new Error('Falta: ' + p.titulo);
  }
  return r;
}
function claseEstado(e) {
  e = String(e).toLowerCase();
  return e.includes('hecho') || e.includes('repar') && !e.includes('en repar') ? 'hecho' : e.includes('en repar') ? 'curso' : e.includes('descart') ? 'desc' : 'pend';
}
function pintarAvisos(l) {
  $('listaAvisos').innerHTML = (l && l.length) ? l.map((a) => `<div class="aviso"><b>${esc(a.piragua)}</b><span>${esc(a.averia)}</span>
    <span>Avisado el ${esc(String(a.fecha).slice(0, 10))}${a.entrega ? ' · llevarla el ' + esc(a.entrega) : ''}${a.prevista ? ' · prevista ' + esc(a.prevista) : ''}</span>
    <span class="chip ${claseEstado(a.estado)}">${esc(a.estado)}</span></div>`).join('')
    : '<p class="vacio">Todavía no has avisado de ninguna avería desde CEPA.</p>';
}
$('formRep').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const msg = $('msg');
  let respuestas;
  try { respuestas = leerRespuestas(); } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; return; }
  $('btnEnviar').disabled = true; msg.textContent = 'Enviando…'; msg.className = 'msg';
  try {
    const r = await api('enviarReparacion', { respuestas });
    pintarAvisos(r.avisos);
    ev.target.reset(); pintarFormulario(YO);
    msg.textContent = 'Aviso enviado. Te llegará un correo con los siguientes pasos.'; msg.className = 'msg ok';
  } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
  finally { $('btnEnviar').disabled = false; }
});
// ---------- Consultar: el estado de todas las piraguas ----------
let TODAS = [], FILTRO = '', CARGADAS = false;
const grupoEstado = (e) => ({ Hecho: 'hecho', Descartado: 'desc' }[e] || 'curso');
function pintarTodas() {
  const l = TODAS.filter((x) => !FILTRO || grupoEstado(x.estado) === FILTRO);
  $('listaTodas').innerHTML = l.length ? l.map((x) => `<div class="aviso">
    <div class="cab"><b>${esc(x.piragua || '')}</b><small>${esc(x.aviso || '')}</small></div>
    <span>${esc(x.obs || '')}</span>
    <span>Avisó ${esc(x.nombre || '—')}${x.entregaTxt && x.estado === 'Esperando la piragua' ? ' · llevarla el ' + esc(x.entregaTxt) : ''}${x.previstaTxt && !['Hecho', 'Descartado'].includes(x.estado) ? ' · prevista ' + esc(x.previstaTxt) : ''}${x.reparadaTxt || x.reparada ? ' · reparada ' + esc(x.reparadaTxt || x.reparada) : ''}</span>
    ${x.com ? `<span>💬 ${esc(x.com)}</span>` : ''}
    <span class="chip ${claseEstado(x.estado)}">${esc(x.estado)}</span>${x.tipo ? `<span class="chip">${esc(x.tipo)}</span>` : ''}</div>`).join('')
    : '<p class="vacio">No hay ninguna con ese filtro.</p>';
}
async function buscarTodas(texto) {
  $('listaTodas').innerHTML = '<p class="vacio">Buscando…</p>';
  try {
    const r = await api('reparaciones', { op: 'historial', buscar: texto || '' });
    TODAS = r.datos || []; CARGADAS = true; pintarTodas();
    if (r.total > TODAS.length) $('listaTodas').insertAdjacentHTML('afterbegin', `<p class="intro">Se ven las ${TODAS.length} más recientes de ${r.total}. Busca una piragua o persona para afinar.</p>`);
  } catch (e) { $('listaTodas').innerHTML = `<p class="msg error">${esc(e.message)}</p>`; }
}
$('formBuscar').addEventListener('submit', (ev) => { ev.preventDefault(); buscarTodas(ev.target.buscar.value.trim()); });
$('filtros').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return; FILTRO = b.dataset.f;
  document.querySelectorAll('#filtros button').forEach((x) => x.classList.toggle('on', x === b)); pintarTodas();
});

document.querySelector('.seg').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.v === 'taller') { location.href = 'taller.html'; return; }
  if (b.dataset.v === 'mios' && !CARGADAS) buscarTodas('');
  document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
  $('vNuevo').classList.toggle('oculto', b.dataset.v !== 'nuevo'); $('vMios').classList.toggle('oculto', b.dataset.v !== 'mios');
});
(async function () {
  try {
    if (!SESION) await entrarConEnlace();
    const d = await api('formularioReparacion');
    pintarFormulario(d);
    if (d.taller) { document.querySelector('#seg [data-v=taller]').classList.remove('oculto'); $('seg').classList.add('tres'); }
    if (location.hash === '#consultar') document.querySelector('#seg [data-v=mios]').click();
  } catch (e) { $('preguntas').innerHTML = `<p class="msg error">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
