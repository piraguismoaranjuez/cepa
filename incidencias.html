<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CEPA">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<title>Incidencias · CEPA</title>
<style>
  :root { --fondo: #f4f1ea; --tinta: #14232b; --suave: #5d6b72; --linea: #ddd6c8; --azul: #2e5797; --rojo: #a33b2b; --verde: #1f7a5a; --ambar: #b7791f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: var(--fondo); color: var(--tinta); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: #fff; border-bottom: 1px solid var(--linea); padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; }
  header a { color: var(--azul); text-decoration: none; font-weight: 600; font-size: 15px; }
  header b { flex: 1; text-align: center; font-size: 17px; margin-right: 52px; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px 50px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #e7e1d5; border-radius: 12px; padding: 3px; margin-bottom: 16px; }
  .seg button { border: 0; background: none; font: inherit; font-weight: 600; padding: 9px; border-radius: 10px; color: var(--suave); }
  .seg button.on { background: #fff; color: var(--tinta); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .caja { background: #fff; border: 1px solid var(--linea); border-radius: 16px; padding: 16px; }
  .intro { font-size: 14.5px; color: var(--suave); margin: 0 0 6px; }
  label.p { display: block; font-weight: 600; font-size: 15px; margin: 16px 0 6px; }
  label.p small { display: block; font-weight: 400; color: var(--suave); font-size: 13px; margin-top: 2px; }
  label.p .ob { color: var(--rojo); }
  input, textarea, select { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--linea); border-radius: 12px; background: #fff; color: var(--tinta); }
  textarea { min-height: 96px; resize: vertical; }
  .opciones { display: grid; gap: 8px; }
  .opciones label { display: flex; align-items: center; gap: 10px; border: 1px solid var(--linea); border-radius: 12px; padding: 11px 12px; font-size: 15px; }
  .opciones label:has(input:checked) { border-color: var(--azul); background: #eef2fa; }
  .opciones input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--azul); }
  button.enviar { margin-top: 20px; width: 100%; font: inherit; font-weight: 650; border: 0; border-radius: 14px; padding: 15px; background: var(--azul); color: #fff; }
  button.enviar[disabled] { opacity: .5; }
  .msg { min-height: 22px; margin-top: 10px; font-size: 15px; } .msg.error { color: var(--rojo); } .msg.ok { color: var(--verde); }
  .aviso { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .aviso b { display: block; } .aviso span { color: var(--suave); font-size: 14px; display: block; margin-top: 2px; }
  .chip { display: inline-block; font-size: 12.5px; border-radius: 99px; padding: 1px 9px; background: #eee9df; margin-top: 6px; }
  .chip.hecho { background: #dcefe6; color: var(--verde); } .chip.curso { background: #e3ecfa; color: var(--azul); }
  .chip.pend { background: #f6e8cf; color: #8a5a12; } .chip.desc { background: #eee; color: #888; }
  .vacio { text-align: center; color: var(--suave); padding: 30px 10px; }
  .oculto { display: none !important; }
  .prio { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .prio label { border: 1px solid var(--linea); border-radius: 10px; padding: 9px 4px; text-align: center; font-size: 14px; font-weight: 600; }
  .prio input { display: none; }
  .prio label:has(input:checked) { border-color: var(--azul); background: #eef2fa; color: var(--azul); }
  .prio label.urg:has(input:checked) { border-color: var(--rojo); background: #f8e6e2; color: var(--rojo); }
  .fotos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .fotos img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--linea); }
  .boton2 { display: inline-block; border: 1px dashed var(--azul); color: var(--azul); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 15px; }
  .aviso .cab { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .aviso .num { color: var(--suave); font-size: 13px; white-space: nowrap; }
  .hist { margin: 10px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--linea); font-size: 14px; }
  .hist div { margin: 0 0 8px; } .hist small { color: var(--suave); display: block; }
  .comentar { display: flex; gap: 6px; margin-top: 8px; } .comentar input { padding: 9px 10px; }
  .comentar button { border: 0; background: var(--azul); color: #fff; border-radius: 10px; padding: 0 14px; font: inherit; font-weight: 600; }
  details summary { cursor: pointer; color: var(--azul); font-size: 14px; margin-top: 8px; }
  .aviso span.chip { display: inline-block; margin-right: 4px; }
  .chip.urgente { background: #f8e6e2; color: var(--rojo); } .chip.alta { background: #f6e8cf; color: #8a5a12; }
</style>
</head>
<body>
<header><a href="index.html">‹ CEPA</a><b>Incidencias</b></header>
<main>
  <div class="seg"><button class="on" data-v="nuevo">Avisar</button><button data-v="mios">Mis avisos <span id="nAbiertas"></span></button></div>

  <section id="vNuevo">
    <div class="caja">
      <p class="intro">Avisa de averías, cosas rotas, problemas o lo que necesites. Llega al momento a la dirección del club y aquí verás cómo va. Para piraguas rotas usa <a href="reparaciones.html">Reparaciones</a>.</p>
      <form id="formInc">
        <label class="p">¿Qué es? <span class="ob">*</span></label>
        <select name="tipo" id="tipo" required><option value="">Cargando…</option></select>
        <label class="p">Título <span class="ob">*</span><small>En pocas palabras: «Lancha 2 no arranca», «Falta un chaleco talla S»…</small></label>
        <input name="titulo" maxlength="140" required>
        <label class="p">Cuéntalo<small>Qué pasa, desde cuándo y lo que hayas hecho.</small></label>
        <textarea name="descripcion"></textarea>
        <label class="p">¿Dónde?</label>
        <input name="lugar" list="lugares" placeholder="Hangar, vestuarios, embarcadero, CETD…">
        <datalist id="lugares"><option value="Hangar"><option value="Embarcadero"><option value="Vestuarios"><option value="Gimnasio"><option value="Oficina"><option value="Lanchas"><option value="Furgoneta / remolque"><option value="CETD La Piragua"><option value="Río"></datalist>
        <label class="p">Prioridad</label>
        <div class="prio"><label><input type="radio" name="prioridad" value="baja"> Baja</label><label><input type="radio" name="prioridad" value="media" checked> Media</label>
          <label><input type="radio" name="prioridad" value="alta"> Alta</label><label class="urg"><input type="radio" name="prioridad" value="urgente"> Urgente</label></div>
        <label class="p">Fotos<small>Hasta 4. Ayudan mucho.</small></label>
        <label class="boton2">📷 Hacer o elegir foto<input type="file" id="fotos" accept="image/*" multiple hidden></label>
        <div class="fotos" id="miniaturas"></div>
        <button class="enviar" id="btnEnviar" disabled>Enviar aviso</button>
        <div class="msg" id="msg"></div>
      </form>
    </div>
  </section>

  <section id="vMios" class="oculto"><div id="lista"></div></section>
</main>

<script>
// ====== CONFIGURACIÓN (la misma que index.html) ======
const API_URL = "https://script.google.com/macros/s/AKfycbynhxyMOkP629Ko55Y-681TfYM0XL3FBwuvoEyl7ewNvxhtzpwJAjYjCUg8nASPufun/exec";
// =====================================================

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guardado = {
  leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  poner(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
let SESION = guardado.leer('mizona_sesion');
// Sin sesión válida: se vuelve al inicio de CEPA, que activa el móvil con el código por correo
function entrarConEnlace() {
  guardado.poner('mizona_sesion', null);
  location.replace('index.html');
  return new Promise(() => {});
}
async function api(accion, datos) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ accion, sesion: SESION }, datos || {})) });
  if (!r.ok) throw new Error('No se ha podido conectar con el club');
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESION' && accion !== 'entrar') { SESION = null; guardado.poner('mizona_sesion', null); await entrarConEnlace(); return api(accion, datos); }
    throw new Error(j.error);
  }
  return j;
}

const ESTADOS = { abierta: ['pend', 'Abierta'], en_curso: ['curso', 'En curso'], esperando: ['pend', 'Esperando'], resuelta: ['hecho', 'Resuelta'], descartada: ['desc', 'Descartada'] };
let TIPOS = {}, FOTOS = [];

// Reduce cada foto a 1600 px en JPEG (más rápida de enviar)
function reducir(archivo) {
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(archivo);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const datos = c.toDataURL('image/jpeg', 0.82);
      ok({ nombre: (archivo.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', datos: datos.split(',')[1], vista: datos });
    };
    img.onerror = () => ko(new Error('No se ha podido leer la foto'));
    img.src = url;
  });
}
$('fotos').onchange = async (ev) => {
  for (const f of [...ev.target.files]) { if (FOTOS.length >= 4) break; try { FOTOS.push(await reducir(f)); } catch (e) {} }
  ev.target.value = '';
  $('miniaturas').innerHTML = FOTOS.map((f, i) => `<img src="${f.vista}" alt="Foto ${i + 1}" data-q="${i}" title="Tocar para quitar">`).join('');
};
$('miniaturas').onclick = (ev) => { const q = ev.target.dataset.q; if (q == null) return; FOTOS.splice(Number(q), 1); $('fotos').onchange({ target: { files: [], value: '' } }); };

function pintar(lista) {
  const abiertas = lista.filter((i) => ['abierta', 'en_curso', 'esperando'].includes(i.estado)).length;
  $('nAbiertas').textContent = abiertas ? `(${abiertas})` : '';
  $('lista').innerHTML = lista.length ? lista.map((i) => { const est = ESTADOS[i.estado] || ['', i.estado]; return `<div class="aviso">
    <div class="cab"><b>${esc(i.titulo)}</b><span class="num">#${i.id}</span></div>
    <span>${esc((TIPOS[i.tipo] || {}).nombre || i.tipo)}${i.lugar ? ' · ' + esc(i.lugar) : ''} · ${esc(i.creado)}${i.nfotos ? ' · ' + i.nfotos + ' foto' + (i.nfotos > 1 ? 's' : '') : ''}</span>
    <span class="chip ${est[0]}">${esc(est[1])}</span> ${i.prioridad === 'urgente' || i.prioridad === 'alta' ? `<span class="chip ${i.prioridad}">${i.prioridad === 'urgente' ? 'Urgente' : 'Alta'}</span>` : ''}
    ${i.solucion ? `<span style="margin-top:6px"><b style="display:inline">Solución:</b> ${esc(i.solucion)}</span>` : ''}
    <details><summary>Historial y comentarios (${i.eventos.length})</summary>
      <div class="hist">${i.eventos.map((e) => `<div>${e.tipo === 'estado' ? `Estado: ${esc(e.antes || '')} → <b style="display:inline">${esc(e.despues)}</b>` : esc(e.texto || '')}<small>${esc(e.fecha)} · ${esc(e.autor)}</small></div>`).join('')}</div>
      ${['resuelta', 'descartada'].includes(i.estado) ? '' : `<form class="comentar" data-id="${i.id}"><input name="texto" placeholder="Añadir un comentario…" maxlength="2000"><button>Enviar</button></form>`}
    </details></div>`; }).join('')
    : '<p class="vacio">Todavía no has avisado de nada.</p>';
}
$('lista').addEventListener('submit', async (ev) => {
  ev.preventDefault(); const f = ev.target, b = f.querySelector('button');
  if (!f.texto.value.trim()) return; b.disabled = true;
  try { pintar((await api('comentarIncidencia', { id: f.dataset.id, texto: f.texto.value })).incidencias); }
  catch (e) { alert(e.message); } finally { b.disabled = false; }
});
$('formInc').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target, msg = $('msg');
  const d = { tipo: f.tipo.value, titulo: f.titulo.value, descripcion: f.descripcion.value, lugar: f.lugar.value, prioridad: f.prioridad.value,
    fotos: FOTOS.map(({ nombre, mime, datos }) => ({ nombre, mime, datos })) };
  $('btnEnviar').disabled = true; msg.textContent = 'Enviando…'; msg.className = 'msg';
  try {
    const r = await api('crearIncidencia', d);
    pintar(r.incidencias); f.reset(); FOTOS = []; $('miniaturas').innerHTML = '';
    msg.textContent = `Aviso #${r.numero} enviado. Te avisaremos aquí de cómo va.`; msg.className = 'msg ok';
  } catch (e) { msg.textContent = e.message; msg.className = 'msg error'; }
  finally { $('btnEnviar').disabled = false; }
});
document.querySelector('.seg').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
  $('vNuevo').classList.toggle('oculto', b.dataset.v !== 'nuevo'); $('vMios').classList.toggle('oculto', b.dataset.v !== 'mios');
});
(async function () {
  try {
    if (!SESION) await entrarConEnlace();
    const d = await api('datosIncidencias');
    d.tipos.forEach((t) => (TIPOS[t.clave] = t));
    $('tipo').innerHTML = '<option value="">Elige…</option>' + d.tipos.map((t) => `<option value="${esc(t.clave)}">${esc(t.nombre)}</option>`).join('');
    $('btnEnviar').disabled = false; pintar(d.incidencias);
    if (location.hash === '#mios') document.querySelector('.seg button[data-v="mios"]').click();
  } catch (e) { $('msg').textContent = e.message; $('msg').className = 'msg error'; }
})();
</script>
</body>
</html>
